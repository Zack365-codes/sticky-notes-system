<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <!--  Links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Link of bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ================= Bootstrap Navbar ========================== -->

    <nav class="navbar navbar-expand-lg bg-body-tertiary nav-color">
      <div class="container">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">My Notes</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact us</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!--=============== Website header ====================-->
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="my-3">Sticky Notes</h1>
      <span class="fs-1" data-bs-toggle="modal" data-bs-target="#exampleModal"
        ><i class="bi bi-plus-circle-fill"></i
      ></span>
    </div>

    <div class="container my-4">
      <div class="row">
        <div class="col-md-4"></div>
      </div>
    </div>

    <div class="container">
      <div class="row" id="notes"></div>
    </div>
    <!-- ================== Modal ================== -->

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form action="#">
              <div class="mb-3">
                <label for="note-title" class="form-label">Title</label>
                <input
                  type="email"
                  class="form-control"
                  id="note-title"
                  placeholder="Sticky Note Title"
                />
              </div>
              <div class="mb-3">
                <label for="Textarea-note" class="form-label">Note Desc</label>
                <textarea
                  class="form-control"
                  id="Textarea-note"
                  rows="3"
                  placeholder="Note desc"
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" id="btn-submit" class="btn btn-primary">
              Add A Note
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Link of jquery -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script>
      $("document").ready(function () {
        $("#btn-submit").on("click", () => {
          let title = $("#note-title").val();
          let desc = $("#Textarea-note").val();

          let html = ` 
           <div class="col-md-3 my-3 del-remove" id="rem">
              <div class="card border-0 shadow-sm sticyNote">
                  <div class="card-body">
                    <h5 class="card-title">${title}</h5>
                    <p class="card-text">${desc}</p>
                    <a href="#" class="delete-note btn btn-danger btn-sm">delete</a>
                  </div>
                </div>
            </div>`;

          $("#note-title").val("");
          $("#Textarea-note").val("");
          $("#notes").append(html);

          $("#exampleModal").modal("hide");
        });
      });

      $(document).on("click", ".delete-note", (arg) => {
        $(arg.target).closest("#rem").remove();
      });
    </script>
  </body>
</html>
