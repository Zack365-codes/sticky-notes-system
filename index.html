<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <!--  Links -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Link of bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ================= Bootstrap Navbar ========================== -->

    <nav class="navbar">
      <div class="container">
        <div class="logo color">Zack365-Codes</div>
        <ul class="nav-links" id="navLinks">
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div class="hamburger" id="hamburger">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </nav>

    <!--=============== Website header ====================-->
    <div class="container text-center">
      <h1 class="my-5">Make Sticky Notes Here</h1>
      <span
        class="fontsize"
        data-bs-toggle="modal"
        data-bs-target="#exampleModal"
        ><i class="bi bi-plus-circle-fill"></i
      ></span>
    </div>

    <div class="container my-4">
      <div class="row">
        <div class="col-md-4"></div>
      </div>
    </div>

    <div class="container">
      <div class="row" id="notes"></div>
    </div>
    <!-- ================== Modal ================== -->

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <!-- Added dark theme classes for your black background website -->
        <div
          class="modal-content bg-dark text-light border-secondary shadow-lg"
        >
          <div class="modal-header border-secondary">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              ✨ Create New Sticky Note
            </h1>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form action="#">
              <div class="mb-3">
                <label for="note-title" class="form-label">Title</label>
                <!-- Fixed type="email" to type="text" -->
                <input
                  type="text"
                  class="form-control bg-black text-light border-secondary"
                  id="note-title"
                  placeholder="Enter note title..."
                  autocomplete="off"
                />
              </div>
              <div class="mb-3">
                <label for="Textarea-note" class="form-label"
                  >Note Description</label
                >
                <textarea
                  class="form-control bg-black text-light border-secondary"
                  id="Textarea-note"
                  rows="3"
                  placeholder="What's on your mind?"
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer border-secondary">
            <button
              type="button"
              class="btn btn-outline-light"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              id="btn-submit"
              class="btn btn-warning fw-semibold"
            >
              Add Note
            </button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Link of jquery -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script>
      $("document").ready(function () {
        let notestr = localStorage.getItem("notes");
        let notes = [];

        if (notestr !== null && notestr !== "") {
          notes = JSON.parse(notestr);
          shownote();
        } else {
          shownote(); 
        }

        $("#btn-submit").on("click", (e) => {
          e.preventDefault();

          let title = $("#note-title").val();
          let desc = $("#Textarea-note").val();

          let colors = ["yellow", "pink", "blue", "green", "purple"];
          let color = colors[Math.floor(Math.random() * colors.length)];

          let noteob = {
            title: title,
            desc: desc,
            color: color,
          };

          notes.push(noteob);
          localStorage.setItem("notes", JSON.stringify(notes));

          shownote();

          $("#note-title").val("");
          $("#Textarea-note").val("");
          $("#exampleModal").modal("hide");
        });

        function shownote() {
          if (notes.length === 0) {
            $("#notes").html(`
                <div class="col-12 text-center text-light my-5">
                    <h3>✨ Welcome to Zack365-Codes Sticky Notes!</h3>
                    <p class="text-secondary mt-3">
                        Looks a bit empty here right now, doesn't it? Don't worry—your ideas are just a click away!
                    </p>
                    <div class="my-4 text-start d-inline-block bg-dark border border-secondary p-4 rounded-3">
                        <strong>How to use:</strong><br>
                        1. Click the **plus icon (+)** above to open the note creator.<br>
                        2. Type in a catchy title and what's on your mind.<br>
                        3. Hit **Add Note** to pin your custom sticky note to the board!
                    </div>
                    <p class=" small mt-2">Created with code by Zunain Yamin.</p>
                </div>
            `);
          } else {
            let allNotesHtml = "";

            notes.forEach((element) => {
              allNotesHtml += `
                <div class="col-md-3 my-3 del-remove rem">
                    <div class="sticyNote ${element.color}">
                        <div class="note-pin"></div>
                        <div class="note-content">
                            <h5 class="note-title">${element.title}</h5>
                            <p class="note-text">${element.desc}</p>
                            <div class="note-footer">
                                <span class="note-date">Just now</span>
                                <a href="#" class="delete-note">Delete</a>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            $("#notes").html(allNotesHtml);
          }
        }

        $(document).on("click", ".delete-note", function (e) {
          e.preventDefault();
          $(this).closest(".rem").remove();
         
        });
      });
    </script>
  </body>
</html>
